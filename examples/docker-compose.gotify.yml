services:
  gotify:
    image: gotify/server:latest
    ports:
      - "8080:80"
    volumes:
      - gotify_data:/app/data
    environment:
      TZ: Europe/Madrid

  filmoteca:
    build: ../.
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      CRON: 0 17 * * *
      GOTIFY_URL: http://gotify:80
      GOTIFY_TOKEN: "${GOTIFY_TOKEN}"
      SMTP_HOST: ""
      SMTP_PORT: ""
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: ""
      EMAIL_TO: ""
    depends_on:
      - gotify

volumes:
  gotify_data:
